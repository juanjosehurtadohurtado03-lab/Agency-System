<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso del Equipo - {{ brand.agency_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root {
            --primary: {{ brand.primary_color or '#1E40AF' }};
            --accent: {{ brand.accent_color or '#10B981' }};
        }
        .bg-agency-primary { background-color: var(--primary); }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <!-- CABECERA DEL PORTAL DEL EQUIPO -->
        <div class="p-8 pb-4 text-center">
            {% if brand.logo_path %}
            <img src="/{{ brand.logo_path }}" alt="{{ brand.agency_name }}" class="max-h-14 mx-auto mb-4 object-contain">
            {% else %}
            <div class="w-14 h-14 rounded-2xl bg-agency-primary mx-auto flex items-center justify-center shadow-lg mb-4">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-1.13a4 4 0 10-4-4 4 4 0 004 4z"/></svg>
            </div>
            {% endif %}
            <span class="inline-block px-3 py-1 bg-indigo-500/10 text-indigo-300 border border-indigo-500/20 text-xs font-semibold rounded-full uppercase tracking-wider mb-2">
                Acceso del Equipo
            </span>
            <h1 class="text-2xl font-bold text-white tracking-tight">{{ brand.agency_name }}</h1>
            <p class="text-xs text-slate-400 mt-1">Portal de Gestión de Clientes</p>
        </div>

        <!-- FORMULARIO DE ACCESO -->
        <div class="p-8 pt-4">
            {% if error %}
            <div class="mb-5 bg-red-950/50 border border-red-800 text-red-300 p-3 text-xs rounded-lg flex items-center gap-2">
                <svg class="w-4 h-4 text-red-400 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/auth/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico</label>
                    <input type="email" name="email" required placeholder="tu-correo@agencia.com" autocomplete="username"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Contraseña</label>
                    <input type="password" name="password" required placeholder="••••••••" autocomplete="current-password"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 text-sm transition">
                </div>

                <button type="submit"
                    class="w-full bg-agency-primary hover:opacity-90 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg text-sm mt-2">
                    Ingresar al Sistema
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-slate-800 text-center">
                <a href="/auth/admin/login" class="text-[11px] font-semibold text-slate-400 hover:text-white transition inline-flex items-center gap-1">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
                    ¿Eres el dueño de la agencia? Acceso administrativo
                </a>
            </div>
        </div>
    </div>

</body>
</html>
