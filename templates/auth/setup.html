<!DOCTYPE html>
<html lang="es" class="h-full bg-slate-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración Inicial del Dueño - {{ product_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-lg w-full bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl overflow-hidden">
        <div class="p-8 pb-4 text-center">
            <div class="w-14 h-14 rounded-2xl bg-indigo-600 mx-auto flex items-center justify-center text-white mb-4 shadow-lg shadow-indigo-500/30">
                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-white tracking-tight">Bienvenido a {{ product_name }}</h1>
            <p class="text-xs text-slate-400 mt-1">Configuración inicial de la cuenta del Dueño / Administrador</p>
        </div>

        <div class="p-8 pt-4">
            {% if error %}
            <div class="mb-5 bg-red-950/60 border border-red-800 text-red-300 p-3 text-xs rounded-lg">
                {{ error }}
            </div>
            {% endif %}

            <form action="/auth/setup" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Nombre Comercial de tu Agencia</label>
                    <input type="text" name="agency_name" required value="Mi Agencia Digital"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Usuario del Dueño (Admin)</label>
                    <input type="text" name="username" required placeholder="admin"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div>
                    <label class="block text-xs font-medium text-slate-300 mb-1">Correo Electrónico del Dueño</label>
                    <input type="email" name="email" required placeholder="dueno@agencia.com"
                        class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Clave Especial</label>
                        <input type="password" name="password" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1">Confirmar Clave</label>
                        <input type="password" name="confirm_password" required placeholder="••••••••"
                            class="w-full px-4 py-2.5 rounded-lg bg-slate-800 border border-slate-700 text-white placeholder-slate-500 focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <p class="text-[11px] text-slate-400">
                    🔒 Esta clave se encriptará inmediatamente mediante bcrypt de 12 rondas antes de almacenarse en SQLite.
                </p>

                <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg text-sm mt-2">
                    Crear Cuenta de Dueño e Iniciar
                </button>
            </form>
        </div>
    </div>

</body>
</html>
