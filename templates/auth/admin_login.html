<!DOCTYPE html>
<html lang="es" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Exclusivo del Dueño - {{ brand.agency_name }}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Color de poder personalizable del login del dueño (por defecto rojo 171,35,48) */
        :root { --admin-power: {{ brand.admin_login_color or 'rgb(171, 35, 48)' }}; }
        /* Fondo: degradado de poder entre el rojo corporativo y negro */
        body {
            background:
                radial-gradient(circle at 20% 20%, color-mix(in srgb, var(--admin-power) 55%, transparent) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, color-mix(in srgb, var(--admin-power) 35%, transparent) 0%, transparent 50%),
                linear-gradient(135deg, var(--admin-power) 0%, #1a0508 55%, #000000 100%);
            background-attachment: fixed;
        }
        .power-icon { background: linear-gradient(145deg, var(--admin-power), #2a060b); }
        .power-badge { background: color-mix(in srgb, var(--admin-power) 22%, transparent); border-color: color-mix(in srgb, var(--admin-power) 45%, transparent); color: color-mix(in srgb, var(--admin-power) 35%, white); }
        .power-btn { background: linear-gradient(90deg, var(--admin-power), #7a0f1a); }
        .power-btn:hover { filter: brightness(1.15); }
        .power-ring:focus { outline: none; box-shadow: 0 0 0 2px color-mix(in srgb, var(--admin-power) 70%, white); border-color: transparent; }
    </style>
</head>
<body class="h-full flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-black/70 backdrop-blur-md border border-white/10 rounded-2xl shadow-2xl overflow-hidden">
        <!-- CABECERA EXCLUSIVA DUEÑO / ROOT -->
        <div class="p-8 pb-4 text-center">
            <div class="power-icon w-14 h-14 rounded-2xl mx-auto flex items-center justify-center shadow-lg mb-4 ring-1 ring-white/20">
                <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z"/></svg>
            </div>
            <span class="power-badge inline-block px-3 py-1 border text-xs font-semibold rounded-full uppercase tracking-wider mb-2">
                Zona Restringida &bull; Nivel Root
            </span>
            <h1 class="text-2xl font-bold text-white tracking-tight">Portal del Jefe de Agencia</h1>
            <p class="text-xs text-white/60 mt-1">Control maestro de clientes, permisos y configuraciones</p>
        </div>

        <!-- FORMULARIO DE ACCESO CON USUARIO Y CONTRASEÑA ENCRIPTADA -->
        <div class="p-8 pt-4">
            {% if error %}
            <div class="mb-5 bg-red-950/60 border border-red-700 text-red-200 p-3 text-xs rounded-lg flex items-center gap-2">
                <svg class="w-4 h-4 text-red-300 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                <span>{{ error }}</span>
            </div>
            {% endif %}

            <form action="/auth/admin/login" method="POST" class="space-y-4">
                <div>
                    <label class="block text-xs font-medium text-white/70 mb-1">Usuario Administrativo</label>
                    <input type="text" name="username" required placeholder="admin" autocomplete="off"
                        class="power-ring w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/15 text-white placeholder-white/40 focus:border-transparent text-sm transition">
                </div>

                <div>
                    <label class="block text-xs font-medium text-white/70 mb-1">Clave Especial Encriptada</label>
                    <input type="password" name="password" required placeholder="••••••••••••"
                        class="power-ring w-full px-4 py-2.5 rounded-lg bg-white/5 border border-white/15 text-white placeholder-white/40 focus:border-transparent text-sm transition">
                </div>

                <button type="submit"
                    class="power-btn w-full text-white font-semibold py-2.5 px-4 rounded-lg transition duration-200 shadow-lg text-sm mt-2">
                    Validar Acceso Maestro
                </button>
            </form>

            <div class="mt-6 pt-5 border-t border-white/10 text-center">
                <a href="/auth/login" class="text-xs text-white/50 hover:text-white/80 transition">
                    &larr; Volver al acceso para empleados
                </a>
            </div>
        </div>
    </div>

</body>
</html>
